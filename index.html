<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Infographic Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Infographic Studio</div>
    <input id="projName" class="projname" aria-label="Project name" value="Untitled project">
    <div class="spacer"></div>
    <button id="btnNew" class="ghost">New</button>
    <button id="btnOpen" class="ghost">Open…</button>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    <button id="btnSave" class="ghost">Save project</button>
    <span class="sep"></span>
    <button id="btnPng">PNG</button>
    <button id="btnHtml" class="primary">Export HTML</button>
    <button id="btnMp4" class="primary">Export MP4</button>
  </header>

  <main class="layout">
    <aside class="templates">
      <div class="tplHead">
        <h2>Templates <span id="tplCount"></span></h2>
        <input id="tplSearch" type="search" placeholder="Search templates…" aria-label="Search templates">
        <div class="chips" id="tplFilter" role="group" aria-label="Filter templates">
          <button data-f="all" class="on">All</button>
          <button data-f="quantitative" title="Charts built from numbers">Quantitative</button>
          <button data-f="qualitative" title="Words, categories, events and connections">Qualitative</button>
          <button data-f="time" title="Templates that animate through time periods">Over time</button>
        </div>
        <label class="inline small">Group by
          <select id="tplSort">
            <option value="purpose">What it shows</option>
            <option value="kind">Type of data</option>
            <option value="az">A–Z (no groups)</option>
          </select>
        </label>
      </div>
      <div id="templateList"></div>
    </aside>

    <section class="stage">
      <nav class="tabs">
        <button data-tab="preview" class="active">Preview</button>
        <button data-tab="data">Data</button>
        <div class="spacer"></div>
        <label class="inline">Size
          <select id="sizeSel"></select>
        </label>
        <span id="customSize" class="inline" hidden>
          <input id="cw" type="number" min="64" max="3840" step="2"> ×
          <input id="ch" type="number" min="64" max="3840" step="2">
        </span>
      </nav>

      <div class="pane" id="pane-preview">
        <div class="canvasWrap" id="canvasWrap"><canvas id="preview"></canvas></div>
        <div class="transport">
          <button id="btnPlay" class="round" aria-label="Play">▶</button>
          <button id="btnRestart" class="round ghost" aria-label="Restart">⟲</button>
          <input type="range" id="scrub" min="0" max="1" step="0.0005" value="0" aria-label="Timeline">
          <span id="timeLbl" class="mono">0.0s / 0.0s</span>
          <label class="inline"><input type="checkbox" id="loopChk"> Loop</label>
        </div>
      </div>

      <div class="pane" id="pane-data" hidden>
        <div class="datatools">
          <button id="dImport">Import CSV…</button>
          <input type="file" id="fileCsv" accept=".csv,.tsv,.txt,text/csv" hidden>
          <button id="dPaste">Paste data…</button>
          <button id="dExport" class="ghost">Download CSV</button>
          <span class="sep"></span>
          <button id="dAddRow" class="ghost">+ Row</button>
          <button id="dAddCol" class="ghost">+ Column</button>
          <button id="dDelRow" class="ghost">− Row</button>
          <button id="dDelCol" class="ghost">− Column</button>
          <button id="dTranspose" class="ghost">Transpose</button>
          <span class="sep"></span>
          <button id="dSample" class="ghost">Load sample data</button>
        </div>
        <div class="imageBar">
          <div class="imgHead">
            <b>Images</b>
            <button id="imgAdd" class="ghost">+ Add images…</button>
            <input type="file" id="fileImg" accept="image/*" multiple hidden>
            <span class="imgHint">Type an image's name into the data (for example in an Icon column) to use it. Click an image to copy its name.</span>
          </div>
          <div id="imageList"></div>
        </div>
        <p class="hint" id="dataHint"></p>
        <div class="gridWrap"><table class="grid" id="grid"></table></div>
      </div>
    </section>

    <aside class="settings" id="settingsPanel"></aside>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="dropHint">Drop a CSV, project file or images</div>

  <script src="vendor/mp4-muxer.js"></script>
  <script src="vendor/world.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
